<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-CN" font-family="sans-serif" data-pptx-page-role="content">
  <rect id="bg" width="1280" height="720" fill="#0B0F19"/>
  <g id="header-title" data-pptx-bounds="120 25 1040 60">
    <text id="page-title" x="120" y="70" fill="#F8FAFC" font-size="36" font-weight="bold">原生平滑过渡演进 (2/3: 深度专注)</text>
  </g>
  
  <g id="status-badge" transform="rotate(8 580 120)" data-pptx-bounds="470 95 220 50">
    <rect x="480" y="100" width="200" height="36" rx="18" fill="#06B6D4"/>
    <text x="580" y="123" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">状态：已聚焦放大 (旋转)</text>
  </g>

  <g id="hero-card" data-pptx-bounds="300 160 680 360">
    <rect x="300" y="160" width="680" height="360" rx="20" fill="#7C3AED"/>
    <text x="350" y="230" fill="#EDE9FE" font-size="32" font-weight="bold">核心服务组件（专注特写）</text>
    <text x="350" y="280" fill="#DDD6FE" font-size="20">平滑（Morph）驱动的几何变换与重塑</text>
    <text x="350" y="340" fill="#FFFFFF" font-size="16">✓ 对象在视口中心自然展开，宽高和内边距同步平滑调整</text>
    <text x="350" y="380" fill="#FFFFFF" font-size="16">✓ 填充颜色由深青色平滑过渡至紫色，突显状态切换</text>
    <text x="350" y="420" fill="#FFFFFF" font-size="16">✓ 上方状态徽章完成坐标位移与角度微旋，动感自然且稳重</text>
  </g>

  <g id="metric-stat" data-pptx-bounds="300 550 680 110">
    <rect x="300" y="550" width="680" height="110" rx="14" fill="#1E293B"/>
    <text x="340" y="600" fill="#F8FAFC" font-size="20" font-weight="bold">第 2 页新增指标区块</text>
    <text x="340" y="635" fill="#94A3B8" font-size="15">此卡片为本页新增对象，翻页时平滑淡入，并在第 3 页自动让位。</text>
  </g>
</svg>
