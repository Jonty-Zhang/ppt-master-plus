<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-CN" font-family="sans-serif" data-pptx-page-role="content">
  <rect id="bg" width="1280" height="720" fill="#0B0F19"/>
  <g id="header-title" data-pptx-bounds="120 40 1040 60">
    <text id="page-title" x="120" y="80" fill="#F8FAFC" font-size="36" font-weight="bold">原生平滑过渡演进 (1/3: 概览)</text>
  </g>
  
  <g id="status-badge" data-pptx-bounds="120 115 180 36">
    <rect x="120" y="115" width="180" height="36" rx="18" fill="#10B981"/>
    <text x="210" y="138" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">状态：初始概览</text>
  </g>

  <g id="hero-card" data-pptx-bounds="120 180 460 420">
    <rect x="120" y="180" width="460" height="420" rx="16" fill="#0E7490"/>
    <text x="160" y="240" fill="#E0F2FE" font-size="28" font-weight="bold">核心服务组件</text>
    <text x="160" y="290" fill="#BAE6FD" font-size="18">PowerPoint 原生平滑（Morph）</text>
    <text x="160" y="340" fill="#FFFFFF" font-size="16">• 跨页对象连续移动与缩放</text>
    <text x="160" y="380" fill="#FFFFFF" font-size="16">• 尺寸、颜色与旋转无缝过渡</text>
    <text x="160" y="420" fill="#FFFFFF" font-size="16">• 保持矢量高清与原生可编辑性</text>
  </g>

  <g id="intro-aside" data-pptx-bounds="640 180 520 420">
    <rect x="640" y="180" width="520" height="420" rx="16" fill="#1E293B"/>
    <text x="680" y="240" fill="#F1F5F9" font-size="24" font-weight="bold">第一页特有说明</text>
    <text x="680" y="290" fill="#94A3B8" font-size="16">此区块仅在第 1 页存在，在进入第 2 页时</text>
    <text x="680" y="325" fill="#94A3B8" font-size="16">将自动柔和淡出，让出视野给重点内容。</text>
    <rect x="680" y="370" width="440" height="180" rx="12" fill="#334155"/>
    <text x="710" y="430" fill="#38BDF8" font-size="18" font-weight="bold">渐变过渡提示</text>
    <text x="710" y="470" fill="#CBD5E1" font-size="15">未配对对象将在翻页时平滑淡入淡出，</text>
    <text x="710" y="505" fill="#CBD5E1" font-size="15">而配对对象将连续变换位置与外观。</text>
  </g>
</svg>
