<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en-US" font-family="Segoe UI, sans-serif" data-pptx-page-role="content">
  <rect id="slide-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>

  <!-- Persistent Navigation Track -->
  <g id="nav-track" data-pptx-role="chrome" data-pptx-bounds="190 40 900 56">
    <rect x="190" y="40" width="900" height="56" rx="28" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- Autonomous Moving Highlight Pill (paired via animations.json) -->
  <g id="highlight-pill" data-pptx-role="decoration" data-pptx-bounds="196 44 216 48">
    <rect x="196" y="44" width="216" height="48" rx="24" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <!-- Static Navigation Tabs (fixed coordinates and typography across all scenes) -->
  <a href="#slide-1">
    <g id="nav-tab-1" data-pptx-role="chrome" data-pptx-bounds="196 44 216 48">
      <rect x="196" y="44" width="216" height="48" rx="24" fill="#FFFFFF" fill-opacity="0"/>
      <text x="304" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Overview</text>
    </g>
  </a>
  <a href="#slide-2">
    <g id="nav-tab-2" data-pptx-role="chrome" data-pptx-bounds="420 44 216 48">
      <rect x="420" y="44" width="216" height="48" rx="24" fill="#FFFFFF" fill-opacity="0"/>
      <text x="528" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Features</text>
    </g>
  </a>
  <a href="#slide-3">
    <g id="nav-tab-3" data-pptx-role="chrome" data-pptx-bounds="644 44 216 48">
      <rect x="644" y="44" width="216" height="48" rx="24" fill="#FFFFFF" fill-opacity="0"/>
      <text x="752" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Architecture</text>
    </g>
  </a>
  <a href="#slide-4">
    <g id="nav-tab-4" data-pptx-role="chrome" data-pptx-bounds="868 44 216 48">
      <rect x="868" y="44" width="216" height="48" rx="24" fill="#FFFFFF" fill-opacity="0"/>
      <text x="976" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Roadmap</text>
    </g>
  </a>

  <!-- Slide Content -->
  <g id="page-header" data-pptx-bounds="100 130 1080 80">
    <text x="100" y="162" font-size="28" font-weight="700" fill="#0F172A">Executive Overview &amp; Platform Mission</text>
    <text x="100" y="194" font-size="16" font-weight="400" fill="#64748B">Unified presentation runtime with deterministic motion and native editable vector primitives</text>
  </g>

  <g id="card-1" data-pptx-bounds="100 240 340 380">
    <rect x="100" y="240" width="340" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="132" y="272" width="48" height="48" rx="12" fill="#EFF6FF"/>
    <text x="156" y="303" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">01</text>
    <text x="132" y="364" font-size="40" font-weight="800" fill="#2563EB">99.8%</text>
    <text x="132" y="408" font-size="20" font-weight="700" fill="#0F172A">Morph Reliability</text>
    <text x="132" y="446" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="132" dy="0">Deterministic object pairing across</tspan>
      <tspan x="132" dy="22">adjacent slides eliminates PowerPoint</tspan>
      <tspan x="132" dy="22">heuristic shape mismatch.</tspan>
    </text>
  </g>

  <g id="card-2" data-pptx-bounds="470 240 340 380">
    <rect x="470" y="240" width="340" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="502" y="272" width="48" height="48" rx="12" fill="#F0FDF4"/>
    <text x="526" y="303" text-anchor="middle" font-size="20" font-weight="700" fill="#16A34A">02</text>
    <text x="502" y="364" font-size="40" font-weight="800" fill="#16A34A">0 px</text>
    <text x="502" y="408" font-size="20" font-weight="700" fill="#0F172A">Static Label Drift</text>
    <text x="502" y="446" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="502" dy="0">Stationary text anchors preserve</tspan>
      <tspan x="502" dy="22">spatial coordinates while highlight</tspan>
      <tspan x="502" dy="22">glides smoothly underneath.</tspan>
    </text>
  </g>

  <g id="card-3" data-pptx-bounds="840 240 340 380">
    <rect x="840" y="240" width="340" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="872" y="272" width="48" height="48" rx="12" fill="#FAF5FF"/>
    <text x="896" y="303" text-anchor="middle" font-size="20" font-weight="700" fill="#9333EA">03</text>
    <text x="872" y="364" font-size="40" font-weight="800" fill="#9333EA">100%</text>
    <text x="872" y="408" font-size="20" font-weight="700" fill="#0F172A">Native DrawingML</text>
    <text x="872" y="446" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="872" dy="0">Fully editable vector shapes and</tspan>
      <tspan x="872" dy="22">typography with zero screenshot</tspan>
      <tspan x="872" dy="22">skin or rasterized fallbacks.</tspan>
    </text>
  </g>
