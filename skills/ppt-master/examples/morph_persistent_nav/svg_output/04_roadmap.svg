<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en-US" font-family="Segoe UI, sans-serif" data-pptx-page-role="content">
  <rect id="slide-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>

  <!-- Persistent Navigation Track -->
  <g id="nav-track" data-pptx-role="chrome" data-pptx-bounds="190 40 900 56">
