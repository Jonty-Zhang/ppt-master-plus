    <text x="124" y="280" font-size="13" font-weight="700" fill="#2563EB">PHASE 01</text>
    <text x="124" y="316" font-size="20" font-weight="700" fill="#0F172A">Source Intake</text>
    <text x="124" y="356" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="124" dy="0">Extracted EMU bounds</tspan>
      <tspan x="124" dy="22">and verified native</tspan>
      <tspan x="124" dy="22">Morph p159 transition</tspan>
      <tspan x="124" dy="22">from user reference</tspan>
      <tspan x="124" dy="22">diagnostic intake.</tspan>
    </text>
  </g>

  <g id="phase-2" data-pptx-bounds="376 240 250 380">
    <rect x="376" y="240" width="250" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
