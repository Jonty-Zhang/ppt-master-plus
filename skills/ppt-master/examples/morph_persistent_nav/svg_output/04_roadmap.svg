      <text x="304" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Overview</text>
    </g>
  </a>
  <a href="#slide-2">
    <g id="nav-tab-2" data-pptx-role="chrome" data-pptx-bounds="420 44 216 48">
      <rect x="420" y="44" width="216" height="48" rx="24" fill="#FFFFFF" fill-opacity="0"/>
      <text x="528" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Features</text>
    </g>
  </a>
  <a href="#slide-3">
    <g id="nav-tab-3" data-pptx-role="chrome" data-pptx-bounds="644 44 216 48">
