      <text x="976" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#0F172A">Roadmap</text>
    </g>
  </a>

  <!-- Slide Content -->
  <g id="page-header" data-pptx-bounds="100 130 1080 80">
    <text x="100" y="162" font-size="28" font-weight="700" fill="#0F172A">Milestones &amp; Delivery Roadmap</text>
    <text x="100" y="194" font-size="16" font-weight="400" fill="#64748B">Progression from user diagnostic reference to verified native presentation output</text>
  </g>

