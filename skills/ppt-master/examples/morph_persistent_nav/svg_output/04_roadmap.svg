      <tspan x="400" dy="22">static text labels and</tspan>
      <tspan x="400" dy="22">isolated highlight</tspan>
      <tspan x="400" dy="22">pill geometry in</tspan>
      <tspan x="400" dy="22">1280x720 canvas.</tspan>
    </text>
  </g>

  <g id="phase-3" data-pptx-bounds="653 240 250 380">
    <rect x="653" y="240" width="250" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="677" y="280" font-size="13" font-weight="700" fill="#9333EA">PHASE 03</text>
    <text x="677" y="316" font-size="20" font-weight="700" fill="#0F172A">Morph Pairing</text>
    <text x="677" y="356" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="677" dy="0">Established exact</tspan>
      <tspan x="677" dy="22">adjacent object pairs</tspan>
      <tspan x="677" dy="22">via animations.json</tspan>
      <tspan x="677" dy="22">with !! naming for</tspan>
      <tspan x="677" dy="22">forced matching.</tspan>
