  </g>

  <g id="phase-4" data-pptx-bounds="930 240 250 380">
    <rect x="930" y="240" width="250" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="954" y="280" font-size="13" font-weight="700" fill="#EA580C">PHASE 04</text>
    <text x="954" y="316" font-size="20" font-weight="700" fill="#0F172A">WPS Hand-off</text>
    <text x="954" y="356" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="954" dy="0">Shipped verified</tspan>
      <tspan x="954" dy="22">deliverable for CC</tspan>
      <tspan x="954" dy="22">office suite visual</tspan>
      <tspan x="954" dy="22">acceptance and frame</tspan>
      <tspan x="954" dy="22">stability check.</tspan>
    </text>
