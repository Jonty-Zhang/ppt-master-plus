      <tspan x="882" dy="24">topology ensuring fault tolerance,</tspan>
      <tspan x="882" dy="24">zero-trust identity security, and</tspan>
      <tspan x="882" dy="24">instantaneous state replication.</tspan>
    </text>

    <rect x="882" y="440" width="286" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="902" y="482" font-size="28" font-weight="800" fill="#9333EA">100%</text>
    <text x="902" y="506" font-size="12" font-weight="500" fill="#64748B">Editable native DrawingML</text>
