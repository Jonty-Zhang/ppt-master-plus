    <text x="136" y="193" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">01</text>
  </g>
  <g id="pillar-caption-1" data-pptx-bounds="112 256 286 22">
    <text x="112" y="270" font-size="14" font-weight="500" fill="#2563EB">High-Speed Vector Pipeline</text>
  </g>

  <!-- Pillar 1: Summary Body (Independent page-local content, native cross-fade in-place) -->
  <g id="pillar-summary-1" data-pptx-bounds="112 300 286 295">
    <text x="112" y="312" font-size="14" font-weight="400" fill="#64748B">
      <tspan x="112" dy="0">Direct AST generation pipeline that</tspan>
      <tspan x="112" dy="24">bypasses headless browser DOM to</tspan>
      <tspan x="112" dy="24">achieve deterministic compilation</tspan>
      <tspan x="112" dy="24">with zero rasterization overhead.</tspan>
    </text>

    <rect x="112" y="440" width="286" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="132" y="482" font-size="28" font-weight="800" fill="#2563EB">&lt; 5 ms</text>
    <text x="132" y="506" font-size="12" font-weight="500" fill="#64748B">Average compilation latency</text>

    <text x="112" y="580" font-size="13" font-weight="600" fill="#2563EB">Pillar 1 Focus: Expanded in next scene &#x2192;</text>
  </g>

  <!-- Pillar 2: Deterministic Morph -->
  <g id="pillar-card-2" data-pptx-bounds="465 130 350 530">
    <rect x="465" y="130" width="350" height="530" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="497" y="162" width="48" height="48" rx="12" fill="#F0FDF4"/>
    <text x="521" y="193" text-anchor="middle" font-size="20" font-weight="700" fill="#16A34A">02</text>
    
    <text x="497" y="244" font-size="22" font-weight="700" fill="#0F172A">Deterministic Morph</text>
    <text x="497" y="270" font-size="14" font-weight="500" fill="#16A34A">Native OpenXML Alignment</text>
    
