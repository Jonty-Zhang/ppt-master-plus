  </g>

  <!-- Pillar 1: Pure Carrier Frame (Paired across slides for smooth geometric expansion) -->
  <g id="pillar-card-1" data-pptx-role="decoration" data-pptx-bounds="80 130 350 530">
    <rect x="80" y="130" width="350" height="530" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <!-- Pillar 1: Identity Title (Paired across slides for spatial translation) -->
  <g id="pillar-title-1" data-pptx-bounds="112 224 286 30">
    <text x="112" y="244" font-size="22" font-weight="700" fill="#0F172A">Core Engine Stack</text>
  </g>
  <g id="pillar-badge-1" data-pptx-bounds="112 162 48 48">
