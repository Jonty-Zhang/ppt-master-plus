      <tspan x="497" dy="24">prevent heuristic shape mismatch,</tspan>
      <tspan x="497" dy="24">enabling smooth camera transitions</tspan>
      <tspan x="497" dy="24">across complex multi-card layouts.</tspan>
    </text>

    <rect x="497" y="440" width="286" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="517" y="482" font-size="28" font-weight="800" fill="#16A34A">99.99%</text>
    <text x="517" y="506" font-size="12" font-weight="500" fill="#64748B">Transition pairing fidelity</text>
  </g>

  <!-- Pillar 3: Cloud Fabric Mesh -->
  <g id="pillar-card-3" data-pptx-bounds="850 130 350 530">
    <rect x="850" y="130" width="350" height="530" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="882" y="162" width="48" height="48" rx="12" fill="#FAF5FF"/>
    <text x="906" y="193" text-anchor="middle" font-size="20" font-weight="700" fill="#9333EA">03</text>
    
    <text x="882" y="244" font-size="22" font-weight="700" fill="#0F172A">Cloud Fabric Mesh</text>
    <text x="882" y="270" font-size="14" font-weight="500" fill="#9333EA">Global Distributed Runtime</text>
    
    <text x="882" y="312" font-size="14" font-weight="400" fill="#64748B">
