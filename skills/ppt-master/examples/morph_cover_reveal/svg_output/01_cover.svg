<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en-US" font-family="Segoe UI, sans-serif" data-pptx-page-role="cover">
  <rect id="slide-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>

  <!-- Subtle Decorative Grid Elements -->
  <g id="bg-accents" data-pptx-role="decoration" data-pptx-bounds="100 80 1080 560" fill-opacity="0.04">
    <circle cx="160" cy="140" r="120" fill="#3B82F6"/>
    <circle cx="1120" cy="560" r="160" fill="#6366F1"/>
  </g>

  <!-- Hero Badge (glides vertically along left lane x=80 to top masthead on Slide 2) -->
  <g id="hero-badge" data-pptx-bounds="80 130 290 52">
    <rect x="80" y="130" width="290" height="52" rx="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="110" cy="156" r="15" fill="#2563EB"/>
    <text x="110" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
    <text x="136" y="161" font-size="13" font-weight="700" fill="#1D4ED8">ENTERPRISE PLATFORM 2026</text>
  </g>

  <!-- Hero Title Block (re-seats to top header area on Slide 2) -->
  <g id="hero-title-block" data-pptx-bounds="390 257 810 40">
    <text x="390" y="285" font-size="32" font-weight="700" fill="#0F172A">Intelligent Autonomous Systems</text>
  </g>
  <g id="cover-caption" data-pptx-bounds="140 310 1000 70" text-anchor="middle">
    <text x="640" y="335" font-size="20" font-weight="500" fill="#475569">Next-Generation Infrastructure Architecture &amp; Execution Runtime</text>
    <text x="640" y="365" font-size="15" font-weight="400" fill="#64748B">Deterministic OpenXML Motion • Native Vector Primitives • High-Availability Mesh</text>
  </g>

  <!-- Hero Showcase Panel -->
  <g id="hero-showcase-panel" data-pptx-bounds="140 420 1000 190">
    <rect x="140" y="420" width="1000" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Column 1: Core Engine -->
    <rect x="180" y="450" width="40" height="40" rx="10" fill="#EFF6FF"/>
    <text x="200" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">01</text>
    <text x="236" y="468" font-size="16" font-weight="700" fill="#0F172A">Core Engine</text>
    <text x="236" y="488" font-size="13" font-weight="400" fill="#64748B">Sub-second vector compilation</text>
    <text x="180" y="540" font-size="28" font-weight="800" fill="#2563EB">&lt; 5 ms</text>
    <text x="180" y="565" font-size="12" font-weight="500" fill="#64748B">Average Pipeline Latency</text>

    <!-- Column 2: Native Morph -->
    <rect x="520" y="450" width="40" height="40" rx="10" fill="#F0FDF4"/>
    <text x="540" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#16A34A">02</text>
    <text x="576" y="468" font-size="16" font-weight="700" fill="#0F172A">Native Morph</text>
    <text x="576" y="488" font-size="13" font-weight="400" fill="#64748B">Deterministic pairing chain</text>
    <text x="520" y="540" font-size="28" font-weight="800" fill="#16A34A">99.99%</text>
    <text x="520" y="565" font-size="12" font-weight="500" fill="#64748B">Transition Success Rate</text>

    <!-- Column 3: Cloud Fabric -->
    <rect x="860" y="450" width="40" height="40" rx="10" fill="#FAF5FF"/>
    <text x="880" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#9333EA">03</text>
    <text x="916" y="468" font-size="16" font-weight="700" fill="#0F172A">Cloud Fabric</text>
    <text x="916" y="488" font-size="13" font-weight="400" fill="#64748B">Global distributed topology</text>
    <text x="860" y="540" font-size="28" font-weight="800" fill="#9333EA">100%</text>
    <text x="860" y="565" font-size="12" font-weight="500" fill="#64748B">Native Vector Editability</text>
  </g>

  <!-- Cover Footer -->
  <g id="cover-footer" data-pptx-role="chrome" data-pptx-bounds="140 645 1000 30">
    <text x="640" y="665" text-anchor="middle" font-size="13" font-weight="500" fill="#94A3B8">Executive Architecture Review • Q1 2026 Strategic Roadmap</text>
  </g>
