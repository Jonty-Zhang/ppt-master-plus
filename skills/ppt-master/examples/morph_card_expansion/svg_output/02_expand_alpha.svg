      <tspan x="85" dy="22">automated policy enforcement before mesh handoff.</tspan>
    </text>

    <rect x="85" y="300" width="22" height="22" rx="6" fill="#EFF6FF"/>
    <text x="96" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">&#x2713;</text>
    <text x="116" y="316" font-size="13" font-weight="600" fill="#0F172A">TLS 1.3 Termination &amp; Automated Cert Rotation</text>

    <rect x="85" y="335" width="22" height="22" rx="6" fill="#EFF6FF"/>
    <text x="96" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">&#x2713;</text>
    <text x="116" y="351" font-size="13" font-weight="600" fill="#0F172A">Token Bucket Rate Limiting (100K bursts/sec)</text>

    <rect x="85" y="370" width="22" height="22" rx="6" fill="#EFF6FF"/>
    <text x="96" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">&#x2713;</text>
    <text x="116" y="386" font-size="13" font-weight="600" fill="#0F172A">HTTP/3 QUIC Protocol Acceleration</text>

    <rect x="85" y="405" width="22" height="22" rx="6" fill="#EFF6FF"/>
    <text x="96" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">&#x2713;</text>
