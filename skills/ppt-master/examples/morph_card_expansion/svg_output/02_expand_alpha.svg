    <text x="895" y="328" font-size="11" font-weight="400" fill="#64748B">Zone status: Optimal</text>

    <rect x="875" y="350" width="295" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="895" y="377" font-size="13" font-weight="700" fill="#0F172A">EU-Central (Frankfurt)</text>
    <text x="895" y="397" font-size="11" font-weight="500" fill="#16A34A">&#x25CF; 16/16 Nodes Operational (18.4K rps)</text>
    <text x="895" y="413" font-size="11" font-weight="400" fill="#64748B">Zone status: Optimal</text>

    <rect x="875" y="435" width="295" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="895" y="462" font-size="13" font-weight="700" fill="#0F172A">AP-South (Singapore)</text>
    <text x="895" y="482" font-size="11" font-weight="500" fill="#16A34A">&#x25CF; 14/14 Nodes Operational (13.6K rps)</text>
    <text x="895" y="498" font-size="11" font-weight="400" fill="#64748B">Zone status: Optimal</text>

    <!-- Bottom summary status -->
    <text x="875" y="538" font-size="12" font-weight="600" fill="#16A34A">&#x2713; Global Cluster Quorum: 100% Synced</text>
