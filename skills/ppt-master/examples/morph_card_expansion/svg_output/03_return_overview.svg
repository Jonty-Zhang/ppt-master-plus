<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="en-US" font-family="Segoe UI, sans-serif" data-pptx-page-role="content">
  <rect id="slide-bg" x="0" y="0" width="1280" height="720" fill="#F8FAFC" data-pptx-role="background"/>

  <!-- Page Header -->
  <g id="page-header" data-pptx-bounds="80 36 1120 70">
    <text x="80" y="62" font-size="26" font-weight="700" fill="#0F172A">Cloud-Native Infrastructure &amp; Service Mesh</text>
    <text x="80" y="88" font-size="14" font-weight="400" fill="#64748B">Explore the gateway architecture, telemetry, and topology</text>
  </g>

  <!-- Card Alpha: Carrier Frame (Pure decoration surface, paired across slides for geometric collapse) -->
  <g id="card-alpha" data-pptx-role="decoration" data-pptx-bounds="80 140 350 520">
    <rect x="80" y="140" width="350" height="520" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <!-- Card Alpha: Identity Title (Stable text group, matched font size & string, spatial translation) -->
  <g id="title-alpha" data-pptx-bounds="110 234 290 30">
    <text x="110" y="254" font-size="22" font-weight="700" fill="#0F172A">API Ingress Gateway</text>
  </g>
  <g id="title-alpha-badge" data-pptx-bounds="110 172 164 48">
    <rect x="110" y="172" width="48" height="48" rx="12" fill="#EFF6FF"/>
    <text x="134" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">GW</text>
    <rect x="170" y="180" width="104" height="26" rx="6" fill="#F1F5F9"/>
    <text x="222" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Edge Gateway</text>
  </g>
  <g id="title-alpha-caption" data-pptx-bounds="110 264 290 22">
    <text x="110" y="278" font-size="13" font-weight="500" fill="#2563EB">Tier-0 Mission Critical Ingress</text>
  </g>

  <!-- Card Alpha: Summary Body (Independent page-local content, native cross-fade in-place) -->
  <g id="summary-alpha" data-pptx-bounds="110 300 290 340">
    <!-- Description -->
    <text x="110" y="316" font-size="13" font-weight="400" fill="#64748B">
      <tspan x="110" dy="0">High-throughput edge routing layer</tspan>
      <tspan x="110" dy="22">handling TLS termination, JWT auth,</tspan>
      <tspan x="110" dy="22">and intelligent canary traffic splitting</tspan>
      <tspan x="110" dy="22">across multi-region Kubernetes clusters.</tspan>
    </text>

    <!-- Telemetry Card -->
    <rect x="110" y="420" width="290" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="130" y="462" font-size="28" font-weight="800" fill="#2563EB">48.2K rps</text>
    <text x="130" y="486" font-size="12" font-weight="500" fill="#64748B">Peak Ingress Request Volume</text>

    <!-- Interactive Re-open Action -->
    <a href="#slide-2">
      <g id="card-alpha-action" data-pptx-bounds="110 595 290 40">
        <rect x="110" y="595" width="290" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
        <text x="255" y="620" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">Expand Modal View &#x2192;</text>
      </g>
    </a>
  </g>

  <!-- Card Beta: Zero-Trust Service Mesh -->
  <g id="card-beta" data-pptx-bounds="465 140 350 520">
    <rect x="465" y="140" width="350" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Icon & Tag -->
    <rect x="495" y="172" width="48" height="48" rx="12" fill="#F0FDF4"/>
    <text x="519" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#16A34A">MS</text>
    
    <rect x="555" y="180" width="104" height="26" rx="6" fill="#F1F5F9"/>
    <text x="607" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Service Mesh</text>

    <!-- Semantic Title -->
    <text x="495" y="254" font-size="22" font-weight="700" fill="#0F172A">Zero-Trust Mesh</text>
    <text x="495" y="278" font-size="13" font-weight="500" fill="#16A34A">Mutual TLS &amp; Envoy Sidecars</text>

    <!-- Description -->
    <text x="495" y="316" font-size="13" font-weight="400" fill="#64748B">
      <tspan x="495" dy="0">Sidecar proxy architecture enforcing</tspan>
      <tspan x="495" dy="22">strict mTLS encryption, dynamic</tspan>
      <tspan x="495" dy="22">service discovery, distributed tracing,</tspan>
      <tspan x="495" dy="22">and fine-grained RBAC access control.</tspan>
    </text>

    <!-- Telemetry Card -->
    <rect x="495" y="420" width="290" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="515" y="462" font-size="28" font-weight="800" fill="#16A34A">99.999%</text>
    <text x="515" y="486" font-size="12" font-weight="500" fill="#64748B">Sidecar Connectivity Uptime</text>

    <text x="495" y="625" font-size="13" font-weight="500" fill="#64748B">Active &#8226; 142 Pods Synced</text>
  </g>

  <!-- Card Gamma: State Consensus Core -->
  <g id="card-gamma" data-pptx-bounds="850 140 350 520">
    <rect x="850" y="140" width="350" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Icon & Tag -->
    <rect x="880" y="172" width="48" height="48" rx="12" fill="#FAF5FF"/>
    <text x="904" y="203" text-anchor="middle" font-size="18" font-weight="700" fill="#9333EA">DB</text>
    
    <rect x="940" y="180" width="104" height="26" rx="6" fill="#F1F5F9"/>
    <text x="992" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Raft Storage</text>

    <!-- Semantic Title -->
    <text x="880" y="254" font-size="22" font-weight="700" fill="#0F172A">State Consensus Core</text>
    <text x="880" y="278" font-size="13" font-weight="500" fill="#9333EA">Multi-Region Raft Cluster</text>

    <!-- Description -->
    <text x="880" y="316" font-size="13" font-weight="400" fill="#64748B">
      <tspan x="880" dy="0">Globally replicated storage engine</tspan>
      <tspan x="880" dy="22">providing linearizable consistency,</tspan>
      <tspan x="880" dy="22">distributed leases, and dynamic</tspan>
      <tspan x="880" dy="22">cluster membership synchronization.</tspan>
    </text>

    <!-- Telemetry Card -->
    <rect x="880" y="420" width="290" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="900" y="462" font-size="28" font-weight="800" fill="#9333EA">&lt; 1.2 ms</text>
    <text x="900" y="486" font-size="12" font-weight="500" fill="#64748B">P99 Read Consensus Latency</text>

    <text x="880" y="625" font-size="13" font-weight="500" fill="#64748B">Active &#8226; 5 Replicas Quorum</text>
  </g>
</svg>
